<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" width="20000mm" height="14000mm">
  <title>Sample floor plan — 16 m × 10 m, drawn at 1 unit = 10 mm</title>

  <!-- Authored in the vector-editor brick's own sheet coordinates (2000 × 1400
       units, 1 unit = 10 mm) so it imports one-to-one with no rescaling.
       It also deliberately uses every shape the importer supports: path, rect,
       circle, ellipse, line, polygon, elliptical arcs, and a nested transform. -->

  <g fill="none" stroke="#1f2937" stroke-width="20" stroke-linecap="square">
    <path data-name="Wall — north" d="M 200 200 L 400 200 M 700 200 L 1200 200 M 1600 200 L 1800 200" />
    <path data-name="Wall — west" d="M 200 200 L 200 1200" />
    <path data-name="Wall — east" d="M 1800 200 L 1800 900 M 1800 1100 L 1800 1200" />
    <path data-name="Wall — south" d="M 200 1200 L 850 1200 M 1050 1200 L 1800 1200" />
  </g>

  <g fill="none" stroke="#374151" stroke-width="14" stroke-linecap="square">
    <path data-name="Partition — office" d="M 1000 200 L 1000 450 M 1000 530 L 1000 700" />
    <path data-name="Partition — corridor" d="M 200 700 L 620 700 M 700 700 L 1800 700" />
    <path data-name="Partition — services" d="M 1350 700 L 1350 950 M 1350 1030 L 1350 1200" />
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="5">
    <path data-name="Window — north west" d="M 400 192 L 700 192 M 400 200 L 700 200 M 400 208 L 700 208" />
    <path data-name="Window — north east" d="M 1200 192 L 1600 192 M 1200 200 L 1600 200 M 1200 208 L 1600 208" />
    <path data-name="Window — east" d="M 1792 900 L 1792 1100 M 1800 900 L 1800 1100 M 1808 900 L 1808 1100" />
  </g>

  <g fill="none" stroke="#6b7280" stroke-width="4">
    <path data-name="Door — office" d="M 1000 530 L 1080 530 A 80 80 0 0 0 1000 450" />
    <path data-name="Door — corridor" d="M 620 700 L 620 620 A 80 80 0 0 0 700 700" />
    <path data-name="Door — services" d="M 1350 950 L 1270 950 A 80 80 0 0 0 1350 1030" />
    <path data-name="Entry swing" d="M 850 1200 L 850 1000 A 200 200 0 0 1 1050 1200" stroke-dasharray="18 12" />
  </g>

  <!-- The stair sits in its own coordinate system; the importer bakes the
       translate into the geometry on the way in. -->
  <g transform="translate(80 40)" fill="none" stroke="#64748b" stroke-width="5">
    <rect data-name="Stair — flight" x="300" y="800" width="250" height="300" />
    <line data-name="Stair — tread 1" x1="300" y1="830" x2="550" y2="830" />
    <line data-name="Stair — tread 2" x1="300" y1="860" x2="550" y2="860" />
    <line data-name="Stair — tread 3" x1="300" y1="890" x2="550" y2="890" />
    <line data-name="Stair — tread 4" x1="300" y1="920" x2="550" y2="920" />
    <line data-name="Stair — tread 5" x1="300" y1="950" x2="550" y2="950" />
    <line data-name="Stair — tread 6" x1="300" y1="980" x2="550" y2="980" />
    <line data-name="Stair — tread 7" x1="300" y1="1010" x2="550" y2="1010" />
    <line data-name="Stair — tread 8" x1="300" y1="1040" x2="550" y2="1040" />
    <line data-name="Stair — tread 9" x1="300" y1="1070" x2="550" y2="1070" />
    <polygon data-name="Stair — up arrow" points="425,820 445,870 425,855 405,870" stroke="#64748b" fill="#64748b" />
    <line data-name="Stair — walking line" x1="425" y1="860" x2="425" y2="1085" />
  </g>

  <g fill="none" stroke="#64748b" stroke-width="5">
    <ellipse data-name="Meeting table" cx="1400" cy="430" rx="240" ry="130" />
    <circle data-name="Seat 1" cx="1200" cy="330" r="45" />
    <circle data-name="Seat 2" cx="1400" cy="290" r="45" />
    <circle data-name="Seat 3" cx="1600" cy="330" r="45" />
    <circle data-name="Seat 4" cx="1200" cy="530" r="45" />
    <circle data-name="Seat 5" cx="1400" cy="570" r="45" />
    <circle data-name="Seat 6" cx="1600" cy="530" r="45" />

    <rect data-name="Counter" x="1420" y="740" width="360" height="110" />
    <circle data-name="Sink" cx="1520" cy="795" r="40" />
    <rect data-name="Hob" x="1620" y="760" width="120" height="70" />

    <rect data-name="Desk 1" x="300" y="280" width="260" height="120" />
    <rect data-name="Desk 2" x="300" y="460" width="260" height="120" />
    <rect data-name="Desk 3" x="620" y="280" width="260" height="120" />
    <rect data-name="Desk 4" x="620" y="460" width="260" height="120" />
  </g>

  <g fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="60 20 10 20">
    <line data-name="Grid line A" x1="140" y1="450" x2="1860" y2="450" />
    <line data-name="Grid line B" x1="1000" y1="140" x2="1000" y2="1260" />
  </g>
</svg>
